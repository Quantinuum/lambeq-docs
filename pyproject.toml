[project]
name = "lambeq-docs"
version = "0.5.0"
description = ""
readme = "README.md"
requires-python = ">=3.10"

[tool.uv]
# For running and testing the notebooks. The docs themselves are built by
# docs-build (see docs-build.config.json), whose API step has its own locked env
# in quartodoc/.
dev-dependencies = [
    "lambeq[extras,test,experimental]>=0.5.0",
    "nbformat~=5.7.3",
    "nbmake>=1.5.4",
    "pip>=24.2",
    "qiskit~=2.0.0",
    "pytket-qiskit>=0.48.0",
    "qiskit-ibm-runtime>=0.17.0",
    "pytket~=2.0.0",
]

[tool.uv.workspace]
members = []
